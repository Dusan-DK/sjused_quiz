<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SJUSED – Aký si nakupujúci?</title>
<meta name="description" content="6 klikov, 45 sekúnd. Zisti, aký si nakupujúci oblečenia online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-300:#fcd34d; --amber-400:#fbbf24;
  --amber-500:#f59e0b; --amber-600:#d97706; --amber-700:#b45309;
  --slate-900:#0f172a; --slate-600:#475569; --slate-500:#64748b; --slate-300:#cbd5e1; --slate-200:#e2e8f0;
  --bg:#f5f8fb;
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg); color:var(--slate-900); overflow-x:hidden;
}

/* animated background blobs */
.blob{position:fixed; border-radius:50%; filter:blur(60px); opacity:.35; background:var(--amber-300); z-index:0; pointer-events:none}
.b1{width:320px;height:320px;top:-80px;left:-90px;animation:drift 16s ease-in-out infinite alternate}
.b2{width:260px;height:260px;bottom:-60px;right:-70px;background:var(--amber-400);animation:drift 20s ease-in-out infinite alternate-reverse}
.b3{width:180px;height:180px;top:45%;right:-60px;opacity:.22;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,60px) scale(1.15)}}

.app{position:relative; z-index:1; max-width:600px; margin:0 auto; padding:18px 16px 48px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; height:48px}
.logo{font-weight:800; letter-spacing:-.01em; font-size:2rem; line-height:1; color:#fdc700}
.back{
  width:40px; height:40px; border-radius:12px; border:2px solid var(--slate-200); background:#fff; cursor:pointer;
  font-size:1.1rem; color:var(--slate-900); box-shadow:0 3px 0 var(--slate-200); transition:transform .15s, opacity .2s;
}
.back:hover{transform:translateY(-1px)}
.back:active{transform:translateY(2px); box-shadow:0 1px 0 var(--slate-200)}
.back.hidden{opacity:0; pointer-events:none}

.track{height:12px; background:var(--slate-200); border-radius:999px; overflow:hidden; margin-top:10px}
.fill{
  height:100%; width:0; border-radius:999px; transition:width .6s var(--ease-pop);
  background:repeating-linear-gradient(-45deg,var(--amber-400) 0 10px,var(--amber-300) 10px 20px);
  background-size:28px 28px; animation:stripes 1s linear infinite;
}
@keyframes stripes{to{background-position:28px 0}}

/* stage + screens */
.stage{flex:1; padding-top:30px; --dx:48px}
.screen{animation:slideIn .5s var(--ease-out) backwards}
.screen.leaving{animation:slideOut .16s ease-in forwards}
@keyframes slideIn{from{opacity:0; transform:translateX(var(--dx))}}
@keyframes slideOut{to{opacity:0; transform:translateX(calc(var(--dx) * -.6))}}

h1,h2{margin:0; font-weight:700; line-height:1.22; letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,6.4vw,2.4rem)}
h2{font-size:clamp(1.4rem,5.2vw,1.9rem)}
h1:focus,h2:focus{outline:none}
.eyebrow{display:inline-block; margin-bottom:12px; padding:4px 12px; border-radius:999px; background:var(--amber-100); color:var(--amber-700); font-size:.75rem; font-weight:600}
.hint{margin:8px 0 0; color:var(--slate-500); font-size:.95rem}
.sub{margin:14px 0 0; color:var(--slate-600); font-size:1.05rem}

/* intro */
.hero{text-align:center; padding-top:12px}
.floaters{display:flex; justify-content:center; gap:18px; margin-bottom:26px}
.floaters .ic{width:68px; height:68px; animation:bob 3.2s ease-in-out infinite}
.floaters .ic:nth-child(2){animation-delay:-1.1s}
.floaters .ic:nth-child(3){animation-delay:-2.1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}
.ic{display:inline-block}
.ic svg{width:100%; height:100%; display:block}

/* options */
.options{display:grid; gap:11px; margin-top:22px}
.options.grid2{grid-template-columns:1fr 1fr}
.opt{
  position:relative; display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  font:inherit; font-weight:500; font-size:1rem; line-height:1.3; color:var(--slate-900);
  background:#fff; border:2px solid var(--slate-200); border-radius:16px; padding:14px 16px; cursor:pointer;
  box-shadow:0 4px 0 var(--slate-200);
  transition:transform .15s, border-color .15s, background .15s, box-shadow .15s;
  animation:optIn .45s var(--ease-out) backwards; animation-delay:calc(var(--i) * 65ms + 120ms);
  -webkit-tap-highlight-color:transparent;
}
@keyframes optIn{from{opacity:0; transform:translateY(16px)}}
.opt:hover{transform:translateY(-2px); border-color:var(--amber-300)}
.opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--slate-200)}
.opt.selected{background:var(--amber-100); border-color:var(--amber-400); box-shadow:0 4px 0 var(--amber-500); animation:pop .32s var(--ease-pop)}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.035)}100%{transform:scale(1)}}
.opt.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.mark{flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--slate-300); display:grid; place-items:center; transition:background .15s, border-color .15s}
.mark svg{width:14px; height:14px; transform:scale(0); transition:transform .25s var(--ease-pop)}
.opt.selected .mark{background:var(--amber-400); border-color:var(--amber-500)}
.opt.selected .mark svg{transform:scale(1)}
.note{min-height:1.4em; margin:12px 2px 0; font-size:.85rem; color:var(--slate-500)}

/* fields */
.field-label{display:block; margin:20px 2px 8px; font-size:.9rem; font-weight:500; color:var(--slate-600)}
.field{
  width:100%; font:inherit; font-size:1rem; color:var(--slate-900); background:#fff;
  border:2px solid var(--slate-200); border-radius:16px; padding:14px 16px; box-shadow:0 4px 0 var(--slate-200);
  transition:border-color .15s, box-shadow .15s; resize:none;
}
.field:focus{outline:none; border-color:var(--amber-400); box-shadow:0 4px 0 var(--amber-500)}
.small{margin:12px 2px 0; font-size:.8rem; color:var(--slate-500)}
.small a{color:inherit}

/* buttons */
.actions{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:24px}
.actions.center{justify-content:center}
.btn{
  font:inherit; font-weight:700; font-size:1rem; color:var(--slate-900); background:var(--amber-400);
  border:0; border-radius:16px; padding:15px 30px; cursor:pointer; box-shadow:0 4px 0 var(--amber-600);
  transition:transform .15s, box-shadow .15s, background .15s; -webkit-tap-highlight-color:transparent;
}
.btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 6px 0 var(--amber-600)}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--amber-600)}
.btn:disabled{background:var(--slate-200); color:var(--slate-500); box-shadow:0 4px 0 var(--slate-300); cursor:not-allowed}
.btn.big{font-size:1.1rem; padding:17px 38px}
.btn.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn.ghost{background:transparent; color:var(--slate-600); box-shadow:none; border:2px solid var(--slate-200)}
.btn.ghost:hover:not(:disabled){box-shadow:none; border-color:var(--slate-300)}
.link{font:inherit; font-size:.95rem; background:none; border:0; padding:6px; color:var(--slate-500); text-decoration:underline; cursor:pointer}
button:focus-visible,.field:focus-visible{outline:3px solid var(--slate-900); outline-offset:3px}

/* result */
.center-text{text-align:center}
.result-card{
  background:#fff; border:3px solid var(--slate-900); border-radius:28px; padding:30px 24px 32px;
  box-shadow:8px 8px 0 var(--amber-400); animation:cardIn .8s var(--ease-pop) .1s backwards;
}
@keyframes cardIn{from{opacity:0; transform:rotate(-5deg) scale(.6)}}
.result-card .ic.big{width:112px; height:112px; margin-bottom:10px; animation:wiggle 3s ease-in-out 1s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}
.result-card h2{font-size:clamp(1.7rem,7vw,2.2rem); margin-bottom:12px}
.quote{margin:0; font-size:1.08rem; color:var(--slate-600); line-height:1.55}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}

@media (max-width:380px){.options.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<!-- icon sprite: flat shapes, brand colors -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-tee" viewBox="0 0 64 64"><path d="M21 9 7 18l6 11 7-4v29h24V25l7 4 6-11-14-9c-2 5-6 8-11 8s-9-3-11-8z" fill="#fbbf24" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-sneaker" viewBox="0 0 64 64"><path d="M6 44V28c7 1 12-2 14-8l8 4c3 3 7 5 12 6l8 2c8 2 12 6 12 12z" fill="#fff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/><rect x="6" y="44" width="54" height="8" rx="4" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/><path d="M26 28l-3 5M33 31l-3 5M40 33l-3 5" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-bag" viewBox="0 0 64 64"><path d="M22 24c0-14 20-14 20 0" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><rect x="9" y="22" width="46" height="34" rx="7" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/><circle cx="23" cy="34" r="2.5" fill="#0f172a"/><circle cx="41" cy="34" r="2.5" fill="#0f172a"/></symbol>
  <symbol id="i-hanger" viewBox="0 0 64 64"><path d="M32 26v-4c0-2 6-3 6-9 0-4-3-6-6-6s-6 2-6 6" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><path d="M32 26 8 43c-3 2-2 7 3 7h42c5 0 6-5 3-7z" fill="#fbbf24" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-tag" viewBox="0 0 64 64"><path d="M8 33 31 10h23v23L31 56z" fill="#fbbf24" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/><circle cx="43" cy="21" r="4" fill="#fff" stroke="#0f172a" stroke-width="3"/><path d="M24 40l10-10" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-tape" viewBox="0 0 64 64"><circle cx="30" cy="30" r="22" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/><circle cx="30" cy="30" r="8" fill="#fff" stroke="#0f172a" stroke-width="3"/><path d="M30 8v5M52 30h-5M30 52v-5M8 30h5" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/><path d="M40 48h18v10H36" fill="#fff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-needle" viewBox="0 0 64 64"><path d="M4 58 14 34l10-6 12 4 14-7 10 33z" fill="#fde68a" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/><path d="M18 52l4-12M30 54l2-14M42 54l-1-12" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/><path d="M50 6 34 36" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><circle cx="49" cy="9" r="2.5" fill="#fff" stroke="#0f172a" stroke-width="2"/></symbol>
  <symbol id="i-smile" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/><path d="M13 27h38v5c0 5-4 8-9 8h-3c-4 0-6-3-6-6 0 3-2 6-6 6h-3c-5 0-9-3-9-8z" fill="#0f172a"/><path d="M22 46c6 6 14 6 20 0" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="app">
  <header>
    <div class="top">
      <div class="logo">SJUSED</div>
      <button class="back hidden" id="back" type="button" aria-label="Späť">&larr;</button>
    </div>
    <div class="track" role="progressbar" aria-label="Priebeh kvízu" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div></div>
  </header>
  <main class="stage" id="stage"></main>
  <noscript>Na zobrazenie kvízu zapni JavaScript.</noscript>
</div>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  ENDPOINT: 'https://script.google.com/macros/s/AKfycby-8ltZg3PdiSpjGTxOcLTX_ZVRBhYu4oHzDxd6btM2JAWR920Oq8U7CkVggfC_xCiywA/exec',  // Google Apps Script URL to receive the answers
  PRIVACY_URL: '/GDPR.html'   // link to "Ochrana osobných údajov" page – shown under the contact field when set
};

/* ============ DATA ============ */
const o = (id, label, flags = {}) => ({ id, label, ...flags });

const Q = {
  freq: { key:'freq', type:'single', eyebrow:'Frekvencia', title:'Ako často kupuješ oblečenie online?', shuffle:false,
    options:[ o('never','Nikdy'), o('few','Pár ráz za rok'), o('monthly','Mesačne'), o('often','Viackrát za mesiac') ] },
  barriers: { key:'barriers', type:'multi', max:2, eyebrow:'Odbočka', title:'Čo ťa od toho drží ďalej?', hint:'Vyber max. 2', shuffle:true,
    options:[ o('b_fit','Neviem, či mi to bude sedieť'), o('b_try','Chcem si to najprv vyskúšať'), o('b_ship','Doprava a vracanie sú komplikované'),
              o('b_trust','Neverím e-shopom'), o('b_care','Nezaujíma ma to',{last:true}) ] },
  shops: { key:'shops', type:'multi', eyebrow:'Kde nakupuješ', title:'Kde najčastejšie nakupuješ?', hint:'Vyber, koľko chceš', shuffle:true, grid:true, other:true,
    options:[ o('zara','Zara'), o('shein','Shein'), o('aboutyou','About You'), o('vinted','Vinted'), o('local','Lokálny e-shop'), o('answear','Answear'), o('other','Inde',{last:true}) ] },
  outcome: { key:'outcome', type:'single', eyebrow:'Ako to dopadlo', title:'Spomeň si na posledný nákup. Ako to dopadlo?', shuffle:true,
    options:[ o('fit','Sedelo perfektne'), o('ret','Nesedela veľkosť, vrátil/a som to'), o('kept','Nesedela veľkosť, nechal/a som si to'),
              o('photo','Nebolo to ako na fotke'), o('tired','Sedelo, ale hľadanie ma vyčerpalo') ] },
  delays: { key:'delays', type:'multi', max:2, eyebrow:'Čo zdržalo', title:'Čo ťa pri hľadaní zdržalo najviac?', hint:'Vyber max. 2', shuffle:true,
    options:[ o('noise','Veľa vecí, čo ma vôbec nezaujímali'), o('shops','Musel/a som prechádzať viac e-shopov'), o('style','Nevedel/a som nájsť svoj štýl'),
              o('budget','Hľadal/a som niečo v rozpočte'), o('size','Riešil/a som veľkosť'), o('smooth','Nič, išlo to hladko',{last:true, exclusive:true}) ] },
  inspo: { key:'inspo', type:'multi', eyebrow:'Inšpirácia', title:'Kde nachádzaš nápady, čo si obliecť?', hint:'Vyber, koľko chceš', shuffle:true, grid:true,
    options:[ o('ig','Instagram'), o('tt','TikTok'), o('pin','Pinterest'), o('friends','Kamaráti'), o('shops','Priamo v e-shopoch'), o('street','Na ulici') ] },
  age: { key:'age', type:'single', eyebrow:'Vek', title:'Posledná: koľko máš rokov?', shuffle:false, grid:true,
    options:[ o('u16','Do 16'), o('a17','17 – 19'), o('a20','20 – 25'), o('a26','26 – 35'), o('a36','36+') ] }
};

const RESULTS = {
  sizer:  { icon:'i-tape',   title:'Hádač veľkostí',    text:'Objednáš a držíš palce. Vieš, že ten tvoj M niekde nie je M. Nie si v tom sám/sama.' },
  lost:   { icon:'i-needle', title:'Stratený v ponuke', text:'Vieš presne, čo chceš, len to medzi tisíckami vecí nie je. Hľadáš ihlu v kope Sheinu.' },
  budget: { icon:'i-tag',    title:'Lovec rozpočtu',    text:'Najlepší kúsok za najlepšiu cenu. Máš radar na zľavy a nenecháš sa nachytať.' },
  easy:   { icon:'i-smile',  title:'Pohodár',           text:'Online nakupovanie ti ide. Zatiaľ si to nezažil/a zle, a to je skoro umenie.' },
  tester: { icon:'i-hanger', title:'Skúšač',            text:'Radšej to nosíš na sebe, než veriť fotke. Má to svoj zmysel.' }
};

/* ============ STATE ============ */
const freshAnswers = () => ({ freq:null, barriers:[], shops:[], shopOther:'', outcome:null, delays:[], inspo:[], age:null, idea:'' });
let answers = freshAnswers();
let order = {};          // remembers the shuffled order so "back" does not reshuffle
let stack = [];          // history for the back button
let current = null, busy = false, locked = false, submitted = false, joined = false;

const SRC = new URLSearchParams(location.search).get('src') || '';   // e.g. ?src=qr-skola
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);

/* ============ LOGIC ============ */
// The "Nikdy" branch skips shops/outcome/delays and jumps straight to inspiration.
function path() {
  const middle = answers.freq === 'never' ? ['barriers'] : ['shops','outcome','delays'];
  return ['intro','freq', ...middle, 'inspo','age','idea','result','contact'];
}
const nextOf = id => path()[path().indexOf(id) + 1];

// Priority top → bottom: the first rule that matches wins.
function pickResult(a) {
  const has = (arr, id) => arr.includes(id);
  if (a.outcome === 'ret' || a.outcome === 'kept' || has(a.delays,'size') || has(a.barriers,'b_fit')) return 'sizer';
  if (['noise','shops','style'].some(id => has(a.delays,id)) || a.outcome === 'tired') return 'lost';
  if (has(a.delays,'budget')) return 'budget';
  if (a.outcome === 'fit' && has(a.delays,'smooth')) return 'easy';
  if (a.freq === 'never') return 'tester';
  return 'tester';   // fallback, e.g. "Nebolo to ako na fotke" + "Nič, išlo to hladko"
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function getOptions(id) {
  if (!order[id]) {
    const q = Q[id];
    order[id] = q.shuffle
      ? [...shuffle(q.options.filter(x => !x.last)), ...q.options.filter(x => x.last)]   // "Inde" / "Nič…" stay at the bottom
      : [...q.options];
  }
  return order[id];
}

function resetBranches() {
  if (answers.freq === 'never') { answers.shops = []; answers.shopOther = ''; answers.outcome = null; answers.delays = []; }
  else answers.barriers = [];
}

async function send(payload) {
  const body = { ...payload, src: SRC, ts: new Date().toISOString() };
  if (!CONFIG.ENDPOINT) { console.info('[SJUSED quiz] no ENDPOINT set, payload:', body); return; }
  try {
    // text/plain + no-cors = "simple request", so Google Apps Script accepts it without a CORS preflight
    await fetch(CONFIG.ENDPOINT, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body), keepalive:true });
  } catch (e) { console.warn('send failed', e); }
}

/* ============ DOM HELPERS ============ */
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  kids.flat().filter(Boolean).forEach(c => el.append(c));
  return el;
}
const icon = (id, cls = '') => { const s = h('span', { class:'ic ' + cls }); s.innerHTML = `<svg viewBox="0 0 64 64"><use href="#${id}"/></svg>`; return s; };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ============ NAVIGATION ============ */
function go(id) { stack.push(current); show(id, 1); }
function back() { if (stack.length) show(stack.pop(), -1); }
$('#back').addEventListener('click', back);

const QUESTION_STEPS = ['freq','barriers','shops','outcome','delays','inspo','age','idea'];

function updateChrome(id) {
  $('#back').classList.toggle('hidden', !QUESTION_STEPS.includes(id));
  const p = path(), total = p.length - 3;
  let pct;
  if (id === 'intro') pct = 0;
  else if (!QUESTION_STEPS.includes(id)) pct = 100;
  else pct = Math.max(8, Math.round(((p.indexOf(id) - 1) / total) * 100));
  $('#fill').style.width = pct + '%';
  $('.track').setAttribute('aria-valuenow', pct);
}

function show(id, dir = 1) {
  if (busy) return;
  busy = true; current = id;
  const stage = $('#stage'), old = stage.firstElementChild;
  stage.style.setProperty('--dx', dir > 0 ? '48px' : '-48px');
  const draw = () => {
    stage.replaceChildren(SCREENS[id]());
    updateChrome(id);
    window.scrollTo(0, 0);
    const hd = stage.querySelector('h1,h2');
    if (hd) { hd.tabIndex = -1; hd.focus({ preventScroll:true }); }
    busy = false; locked = false;
  };
  if (old && !reduced) { old.classList.add('leaving'); setTimeout(draw, 160); } else draw();
}

function reset() { answers = freshAnswers(); order = {}; stack = []; submitted = false; joined = false; current = null; show('intro'); }

/* ============ SCREENS ============ */
function renderQuestion(id) {
  const q = Q[id], opts = getOptions(id), multi = q.type === 'multi';
  const picked = () => multi ? answers[q.key] : [answers[q.key]];

  const note = h('p', { class:'note', 'aria-live':'polite' });
  const next = h('button', { class:'btn', type:'button' }, 'Ďalej');
  const list = h('div', { class:'options' + (q.grid ? ' grid2' : ''), role: multi ? 'group' : 'radiogroup', 'aria-label': q.title });

  const buttons = opts.map((opt, i) => {
    const mark = h('span', { class:'mark' }); mark.innerHTML = CHECK;
    const b = h('button', { class:'opt', type:'button', 'aria-pressed':'false', style:`--i:${i}` }, mark, h('span', {}, opt.label));
    b.addEventListener('animationend', () => b.classList.remove('shake'));
    return b;
  });

  const paint = () => {
    buttons.forEach((b, i) => {
      const on = picked().includes(opts[i].id);
      b.classList.toggle('selected', on);
      b.setAttribute('aria-pressed', String(on));
    });
    if (multi) {
      next.disabled = !answers[q.key].length;
      note.textContent = q.max ? `Vybrané ${answers[q.key].length}/${q.max}` : '';
    }
  };

  const toggle = (opt, b) => {
    let cur = answers[q.key];
    if (cur.includes(opt.id)) cur = cur.filter(x => x !== opt.id);
    else {
      cur = opt.exclusive ? [] : cur.filter(x => !opts.find(p => p.id === x).exclusive);
      if (q.max && cur.length >= q.max) {
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        note.textContent = `Max. ${q.max} – najprv jednu odznač.`;
        return;
      }
      cur = [...cur, opt.id];
    }
    answers[q.key] = cur; paint();
  };

  buttons.forEach((b, i) => b.addEventListener('click', () => {
    if (multi) return toggle(opts[i], b);
    if (locked) return;
    locked = true;                       // ignore double taps while the screen slides away
    answers[q.key] = opts[i].id;
    if (id === 'freq') resetBranches();
    paint();
    setTimeout(() => go(nextOf(id)), 360);
  }));
  list.append(...buttons);

  const screen = h('section', { class:'screen' },
    h('span', { class:'eyebrow' }, q.eyebrow), h('h2', {}, q.title), q.hint ? h('p', { class:'hint' }, q.hint) : null, list);

  if (q.other) {   // free-text "somewhere else" field
    const input = h('input', { class:'field', id:'other', type:'text', maxlength:'80', placeholder:'Tvoj e-shop alebo obchod…', autocomplete:'off' });
    input.value = answers.shopOther;
    input.addEventListener('input', () => {
      answers.shopOther = input.value;
      if (input.value.trim() && !answers.shops.includes('other')) answers.shops = [...answers.shops, 'other'];
      paint();
    });
    screen.append(h('label', { class:'field-label', for:'other' }, 'Nakupuješ inde? Napíš nám kde – budeme radi za tvoju iniciatívu.'), input);
  }

  if (multi) {
    next.addEventListener('click', () => go(nextOf(id)));
    screen.append(note, h('div', { class:'actions' }, next));
  }
  paint();
  return screen;
}

function finish() {
  if (!submitted) {
    submitted = true;
    send({ type:'quiz', freq:answers.freq, barriers:answers.barriers, shops:answers.shops, shopOther:answers.shopOther.trim(),
           outcome:answers.outcome, delays:answers.delays, inspo:answers.inspo, age:answers.age, idea:answers.idea.trim(),
           result:pickResult(answers) });
  }
  go('result');
}

function confetti() {
  if (reduced) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#fbbf24','#f59e0b','#0f172a','#64748b','#fcd34d'];
  const ps = Array.from({ length:130 }, () => ({
    x:innerWidth / 2, y:innerHeight * .4, vx:(Math.random() - .5) * 14, vy:-Math.random() * 14 - 4,
    s:Math.random() * 8 + 5, r:Math.random() * 6, vr:(Math.random() - .5) * .4, c:colors[Math.random() * colors.length | 0] }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (++t < 110) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

const SCREENS = {
  intro: () => h('section', { class:'screen hero' },
    h('div', { class:'floaters', 'aria-hidden':'true' }, icon('i-tee'), icon('i-sneaker'), icon('i-bag')),
    h('h1', {}, 'Chceš zistiť aký si typ nakupujúceho?'),
    h('p', { class:'sub' }, '6 klikov, 45 sekúnd. Na konci zistíš, ako nakupuješ, a tým pomôžeš zlepšiť platformu, ktorá uľahčuje online nakupovanie.'),
    h('div', { class:'actions center' }, h('button', { class:'btn big pulse', type:'button', onclick:() => go('freq') }, 'Poďme na to'))),

  idea: () => {
    const ta = h('textarea', { class:'field', rows:'4', maxlength:'400', 'aria-label':'Tvoja odpoveď', placeholder:'Napíš čokoľvek – stačí jedna veta…' });
    ta.value = answers.idea;
    const next = h('button', { class:'btn', type:'button' }, 'Ďalej');
    const skip = h('button', { class:'btn ghost', type:'button' }, 'Preskočiť');
    next.disabled = !ta.value.trim();
    ta.addEventListener('input', () => { answers.idea = ta.value; next.disabled = !ta.value.trim(); });
    next.addEventListener('click', finish);
    skip.addEventListener('click', () => { answers.idea = ''; finish(); });
    return h('section', { class:'screen' },
      h('span', { class:'eyebrow' }, 'Voliteľné'),
      h('h2', {}, 'Ako by si si uľahčil/a online nakupovanie?'),
      h('p', { class:'hint' }, 'Keby si mohol/mohla zmeniť jednu vec na online nákupe oblečenia, čo by to bolo?'),
      h('div', { class:'options' }, ta),
      h('div', { class:'actions' }, next, skip));
  },

  result: () => {
    const r = RESULTS[pickResult(answers)];
    setTimeout(confetti, 450);
    return h('section', { class:'screen center-text' },
      h('div', { class:'result-card' },
        icon(r.icon, 'big'), h('div', {}, h('span', { class:'eyebrow' }, 'Tvoj typ nakupujúceho')),
        h('h2', {}, r.title), h('p', { class:'quote' }, r.text)),
      h('div', { class:'actions center' }, h('button', { class:'btn big', type:'button', onclick:() => go('contact') }, 'Ďalej')));
  },

  contact: () => {
    const lead = 'Toto je len začiatok. Staviame sprievodcu, ktorý ti nájde oblečenie na mieru, aby ti sadlo na prvý raz.';
    // Under 16 = no consent to data processing in Slovakia, so we do not ask for any contact.
    if (answers.age === 'u16') {
      return h('section', { class:'screen' },
        h('h2', {}, 'Ďakujeme, že si to dokončil/a!'),
        h('p', { class:'sub' }, lead),
        h('p', { class:'small' }, 'Odpovede sú anonymné.'),
        h('div', { class:'actions' }, h('button', { class:'link', type:'button', onclick:reset }, 'Začať odznova')));
    }
    const input = h('input', { class:'field', type:'text', maxlength:'80', autocomplete:'off', 'aria-label':'Instagram alebo e-mail', placeholder:'Instagram alebo e-mail (nepovinné)' });
    const add = h('button', { class:'btn big', type:'button' }, 'Pridať ma');
    const no = h('button', { class:'link', type:'button' }, 'Nie, ďakujem');
    const valid = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || /^@?[A-Za-z0-9._]{2,30}$/.test(v);
    add.disabled = true;
    input.addEventListener('input', () => { add.disabled = !valid(input.value.trim()); });
    add.addEventListener('click', () => { joined = true; send({ type:'waitlist', contact:input.value.trim() }); go('done'); });
    no.addEventListener('click', () => { joined = false; go('done'); });
    return h('section', { class:'screen' },
      h('h2', {}, lead + ' Chceš ho vyskúšať ako prvý/prvá?'),
      h('div', { class:'options' }, input),
      h('div', { class:'actions' }, add, no),
      h('p', { class:'small' }, 'Odpovede sú anonymné. Kontakt použijeme len na pozvánku na vyskúšanie. ',
        CONFIG.PRIVACY_URL ? h('a', { href:CONFIG.PRIVACY_URL, target:'_blank', rel:'noopener' }, 'Ochrana osobných údajov') : null));
  },

  done: () => h('section', { class:'screen center-text' },
    h('div', { class:'floaters', 'aria-hidden':'true' }, icon('i-smile')),
    h('h2', {}, joined ? 'Si v hre!' : 'Ďakujeme za tvoj čas!'),
    h('p', { class:'sub' }, joined ? 'Ozveme sa ti, hneď ako bude sprievodca pripravený.' : 'Tvoje odpovede nám pomáhajú stavať lepšiu appku.'),
    h('div', { class:'actions center' }, h('button', { class:'link', type:'button', onclick:reset }, 'Začať odznova')))
};
Object.keys(Q).forEach(id => { SCREENS[id] = () => renderQuestion(id); });

show('intro');
</script>
